<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="1;url=https://basicfit-prix-m1.floot.app/dashboard">
<meta name="robots" content="noindex">
<title>Dashboard — Basic-Fit</title>
<style>
:root{--ink:#151515;--muted:#686868;--paper:#f7f7f4;--orange:#f36f21;--line:#ddddda}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 85% 5%,rgba(243,111,33,.14),transparent 28%),var(--paper);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
.card{width:min(620px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:38px;box-shadow:0 20px 60px rgba(0,0,0,.06)}
.eyebrow{text-transform:uppercase;letter-spacing:.13em;color:var(--orange);font-size:.72rem;font-weight:900}
h1{font-size:clamp(2.5rem,7vw,4.5rem);line-height:.95;letter-spacing:-.06em;margin:10px 0 16px}
p{color:var(--muted)}a{display:inline-block;margin-top:15px;background:#171717;color:#fff;text-decoration:none;padding:13px 16px;border-radius:12px;font-weight:850}a:hover{background:var(--orange)}
</style>
</head>
<body>
<main class="card">
<p class="eyebrow">Dashboard privé</p>
<h1>Redirection vers les résultats</h1>
<p>Le dashboard connecté à la nouvelle base de données est hébergé sur Floot et protégé par connexion Google.</p>
<a href="https://basicfit-prix-m1.floot.app/dashboard">Ouvrir le dashboard →</a>
</main>
</body>
</html>
